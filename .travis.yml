language: node_js
node_js:
- 8
addons:
  ssh_known_hosts:
  - "$PRODUCTION_SERVER"
script:
- npm run build

before_deploy:
- openssl aes-256-cbc -K $encrypted_5b90fb13c77b_key -iv $encrypted_5b90fb13c77b_iv
  -in id_rsa_gs.enc -out /id_rsa_gs -d
- eval "$(ssh-agent -s)"
- chmod 600 /id_rsa_gs
- ssh-add /id_rsa_gs

deploy:
- provider: script
  skip_cleanup: true
  script: rsync -r --delete-after --quiet ./dist/ $PRODUCTION_SERVER_USER@$PRODUCTION_SERVER:$FOLDER_DEPLOY
  on:
    branch: master
