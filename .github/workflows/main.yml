name: Node.js CI

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install yarn
        run: npm install -g yarn

      - name: Yarn install
        run: yarn

      - name: Configure environment variables
        run: |
          cat >>.env <<END
          VITE_API_ENDPOINT=$VITE_API_ENDPOINT
          VITE_AUTH_ENDPOINT=$VITE_AUTH_ENDPOINT
          VITE_DOC_ENDPOINT=$VITE_DOC_ENDPOINT
          END
        env:
          VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}
          VITE_AUTH_ENDPOINT: ${{ secrets.VITE_AUTH_ENDPOINT }}
          VITE_DOC_ENDPOINT: ${{ secrets.VITE_DOC_ENDPOINT }}

      - name: build
        run: yarn build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key

          # Ajouter le host key du serveur aux hosts connus
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}

      - name: Deploy build
        run: rsync -rtz --delete --timeout 30 -e ssh dist/ staging:app.gestsis.ch
