name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un seul run par branche : les PR annulent le run précédent,
# les déploiements sur main sont mis en file (jamais deux rsync --delete en parallèle)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installe pnpm (packageManager) et Node (devEngines.runtime), puis lance pnpm install
      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Check (format, lint, types)
        run: pnpm check

      - name: Configure environment variables
        run: |
          cat >>.env <<END
          VITE_API_ENDPOINT=$VITE_API_ENDPOINT
          VITE_AUTH_ENDPOINT=$VITE_AUTH_ENDPOINT
          VITE_DOC_ENDPOINT=$VITE_DOC_ENDPOINT
          VITE_SENTRY_DSN=$VITE_SENTRY_DSN
          VITE_SENTRY_RELEASE=$GITHUB_SHA
          END
        env:
          VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}
          VITE_AUTH_ENDPOINT: ${{ secrets.VITE_AUTH_ENDPOINT }}
          VITE_DOC_ENDPOINT: ${{ secrets.VITE_DOC_ENDPOINT }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: build
        run: pnpm build
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_DISABLE_UPDATE_CHECK: "1"

      - name: Configure SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key

          # Clés du serveur vérifiées et stockées en secret (pas de ssh-keyscan : il ferait
          # confiance à n'importe quelle clé reçue au moment du déploiement)
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts

          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}

      - name: Deploy build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rsync -rtz --delete --timeout 30 -e ssh dist/ staging:app.gestsis.ch
