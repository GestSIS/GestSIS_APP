name: Node.js CI

on:
  push:
    branches: [ master ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install yarn
        run: npm add -g yarn

      - name: Yarn install
        run: yarn

      - name: Configure environement variables
        run: |
          cat >>.env <<END
          VITE_API_ENDPOINT=$VITE_API_ENDPOINT
          VITE_AUTH_ENDPOINT=$VITE_AUTH_ENDPOINT
          END
        env:
          SSH_USER: ${{ secrets.VITE_API_ENDPOINT }}
          SSH_KEY: ${{ secrets.VITE_AUTH_ENDPOINT }}

      - name: build
        run: yarn build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}

      - name: Deploy build
        run: scp -r dist staging:app.gestsis.ch
